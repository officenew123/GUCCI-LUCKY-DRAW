<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lucky Draw Wheel</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: #f8f8f8;
  display: flex;
  min-height: 100vh;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background:
      linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.78)),
      url("assets/bg.jpg") center/cover no-repeat;
    filter: blur(14px);
    z-index: -1;
}

    .page {
      width: 100%;
      max-width: 1000px;
      padding: 20px;
    }

    .card {
  background: rgba(0, 0, 0, 0.35); /* transparan gelap */
  backdrop-filter: blur(18px);     /* BLUR UTAMA */
  -webkit-backdrop-filter: blur(18px); /* untuk Safari */

  border-radius: 22px;
  padding: 26px 28px 30px;

  /* Shadow mewah */
  box-shadow:
    0 20px 60px rgba(0, 0, 0, 0.85),
    inset 0 0 0 1px rgba(255, 255, 255, 0.07);

  /* Border kaca */
  border: 1px solid rgba(255, 255, 255, 0.08);

  /* Tambahan efek premium */
  position: relative;
}

.card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: inherit;

  /* Refleksi kaca lembut */
  background: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0.08) 0%,
    rgba(255, 255, 255, 0.02) 45%,
    rgba(255, 255, 255, 0.05) 100%
  );

  pointer-events: none;
}

    .card-header h1 {
      margin: 0 0 6px;
      font-size: 26px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffd24a;
    }

    .card-header p {
      margin: 0 0 60px;
      font-size: 13px;
      color: #dddddd;
    }

    .card-body {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .wheel-container {
      position: relative;
    }

    .pointer {
  position: absolute;
  top: -48px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;

  /* bentuk panah */
  border-left: 26px solid transparent;
  border-right: 26px solid transparent;
  border-top: 48px solid #ffd84d;  /* Gold Base */

  /* efek glow kombinasi */
  filter:
      drop-shadow(0 0 6px rgba(255, 215, 0, 0.9))   /* gold glow */
      drop-shadow(0 0 14px rgba(255, 180, 0, 0.8))  /* warm aura */
      drop-shadow(0 0 25px rgba(255, 0, 0, 0.6))    /* red neon aura */
      drop-shadow(0 4px 10px rgba(0,0,0,0.8));      /* 3D shadow */

  /* animasi blink + breathing glow */
  animation: premiumGlow 1.6s infinite ease-in-out;
  z-index: 30;
}

/* Animasi glow */
@keyframes premiumGlow {
  0% {
    filter:
      drop-shadow(0 0 4px rgba(255, 215, 0, 0.9))
      drop-shadow(0 0 10px rgba(255, 180, 0, 0.8))
      drop-shadow(0 0 18px rgba(255, 0, 0, 0.4))
      drop-shadow(0 4px 10px rgba(0,0,0,0.8));
  }
  100% {
    filter:
      drop-shadow(0 0 12px rgba(255, 255, 100, 1))
      drop-shadow(0 0 25px rgba(255, 200, 0, 1))
      drop-shadow(0 0 35px rgba(255, 0, 0, 0.9))
      drop-shadow(0 6px 12px rgba(0,0,0,0.9));
  }
}

    /* Roda versi premium */
#wheel {
  width: min(60vw, 380px);
  height: min(60vw, 380px);
  border-radius: 50%;
  position: relative;
  overflow: hidden;

  /* outer ring emas */
  background-color: #1a1a1a;
  border: 6px solid #caa33a;

  /* glow & shadow */
  box-shadow:
    0 0 0 3px #f5e3a1,
    0 18px 40px rgba(0, 0, 0, 0.9),
    0 0 45px rgba(0, 0, 0, 0.85);

  transition: transform 5s ease, box-shadow 0.4s ease;
}

#wheel.wheel-spinning {
  box-shadow:
    0 0 0 3px #ffeaa0,
    0 0 30px rgba(255, 223, 128, 0.9),
    0 26px 60px rgba(0, 0, 0, 1);
}

#wheel::before {
  content: "";
  position: absolute;
  inset: 12px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.18);
  box-shadow:
    inset 0 0 18px rgba(0, 0, 0, 0.7),
    0 0 18px rgba(255, 255, 255, 0.12);
  pointer-events: none;
}

#wheel::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 15%, rgba(255,255,255,0.45), transparent 60%),
    radial-gradient(circle at 70% 85%, rgba(0,0,0,0.55), transparent 55%);
  mix-blend-mode: screen;
  opacity: 0.7;
  pointer-events: none;
}

.wheel-center {
  position: absolute;
  width: 18%;
  height: 18%;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 5;

  background: radial-gradient(circle at 30% 30%, #444, #050505);
  border: 4px solid #000;

  box-shadow:
    0 0 12px rgba(0,0,0,0.9),
    inset 0 2px 5px rgba(255,255,255,0.15);
}

    .segment-label {
      position: absolute;
      width: 40%;
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      transform: translate(-50%, -50%);
      color: #111;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
    }

    .detail-panel {
      min-width: 240px;
      flex: 1;
    }

    .detail-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
      color: #ffd24a;
      text-transform: uppercase;
    }

    .detail-panel ul {
      margin: 0 0 16px;
      padding-left: 18px;
      font-size: 13px;
      color: #f1f1f1;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button,
    .btn-link {
      font-family: inherit;
    }

    .btn {
      border-radius: 999px;
      border: none;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #ffd24a, #f0a400);
      color: #111;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }

    .btn-gold:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.7);
    }

    .btn-wa {
      background: #25d366;
      color: #041307;
      box-shadow: 0 6px 14px rgba(0,0,0,0.6);
      text-decoration: none;
    }

    .btn-wa:hover {
      background: #1bb556;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: #f4f4f4;
      border: 1px solid #666;
    }

    .btn-outline:hover {
      background: #222;
    }

    .btn.danger {
      border-color: #ff5c5c;
      color: #ff7777;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .card-footer {
      margin-top: 20px;
      border-top: 1px solid #222;
      padding-top: 16px;
    }

    .input-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    #memberId {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid #444;
      background: #111;
      color: #f8f8f8;
      font-size: 13px;
      outline: none;
    }

    #memberId::placeholder {
      color: #777;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    #resultBanner {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      background: #111;
      border: 1px solid #333;
      color: #f1f1f1;
    }

    .result-success {
      border-color: #2ecc71;
      background: rgba(46, 204, 113, 0.1);
      color: #b7ffd2;
    }

    .result-info {
      border-color: #444;
      background: #111;
      color: #ddd;
    }

    .small-note {
      margin-top: 8px;
      font-size: 11px;
      color: #aaaaaa;
    }

    @media (max-width: 700px) {
      .card {
        padding: 18px 16px 22px;
      }
      .card-header p {
  margin: 0 0 16px;
  font-size: 13px;
  color: #dddddd;
}

/* === FONT GUCCI PREMIUM === */
.title-gucci {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #f4d76e;              /* warna emas */
    text-shadow: 0 0 8px rgba(255, 215, 120, 0.5);
}

.subtitle-gucci {
    font-family: 'Poppins', sans-serif;
    font-weight: 300;
    color: #dcdcdc;
    font-size: 13px;
    margin-top: -8px;
}

    }
/* === EFEK EMAS PREMIUM UNTUK PANEL DETAIL HADIAH === */

/* Glow lembut di panel */
.detail-panel {
    animation: panelGlow 4s ease-in-out infinite alternate;
}

/* Judul dengan gradient emas bergerak */
.detail-panel h2 {
    position: relative;
    display: inline-block;

    background: linear-gradient(
        120deg,
        #c9a23a,
        #f8e49a,
        #f1c45d,
        #fff4c0
    );
    background-size: 250% 250%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation: goldFlow 3.5s linear infinite;
}

/* Garis tipis emas di bawah judul */
.detail-panel h2::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 2px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f9df8b, #f5c24f, #f9df8b);
    box-shadow: 0 0 8px rgba(249, 223, 139, 0.8);
}

/* Animasi gradient emas */
@keyframes goldFlow {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

}

/* Animasi glow panel */
@keyframes panelGlow {
    0% {
        box-shadow:
          0 0 22px rgba(0, 0, 0, 0.8),
          0 0 0 rgba(255, 210, 90, 0.0);
        border-color: rgba(255, 215, 100, 0.35);
    }
    100% {
        box-shadow:
          0 0 26px rgba(0, 0, 0, 0.9),
          0 0 30px rgba(255, 210, 90, 0.32);
        border-color: rgba(255, 225, 130, 0.85);
    }
}

  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="card-header">
        <h1 class="title-gucci">GUCCI INDONESIA — Lucky Draw</h1>
        <p> Masukkan Nomor/ID Member lalu putar roda. 1 member hanya 1x spin.</p>

      </div>

      <div class="card-body">
        <!-- Wheel -->
        <div class="wheel-container">
          <div class="pointer"></div>
          <div id="wheel">
            <div class="wheel-center"></div>
          </div>
        </div>

        <!-- Detail hadiah + tombol WA / Reset -->
        <div class="detail-panel">
          <h2 class="title-gucci">Detail Hadiah</h2>
          <ul id="prizeList">
            <!-- diisi otomatis dari app.js -->
          </ul>

          <div class="btn-row">
            <a id="waBtn" class="btn btn-wa btn-link" href="#" target="_blank">
              Klaim via WhatsApp
            </a>
            <button id="resetBtn" class="btn btn-outline danger" type="button">
              Reset (Admin)
            </button>
          </div>

          <div class="small-note" id="adminInfo">
            Nomor admin WhatsApp: <b>+62 813-1234-5678</b><br />
            Silakan screenshot hasil menang dan kirim ke admin untuk klaim.
          </div>
        </div>
      </div>

      <!-- Footer: input member + tombol -->
      <div class="card-footer">
        <div class="input-row">
          <input
            id="memberId"
            type="text"
            placeholder="Masukkan Nomor / ID Member"
          />
          <button id="verifyBtn" class="btn btn-outline" type="button">
            Verifikasi
          </button>
        </div>

        <div class="action-buttons">
          <button id="spinBtn" class="btn btn-gold" type="button" disabled>
           Spin Sekarang
          </button>
        </div>

        <div id="resultBanner" class="result-info">
          Silakan masukkan ID member dan klik Verifikasi.
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
